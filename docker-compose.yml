services:
  # ---- Gitea: Obsidian vault(md)を管理するGitサーバー ----
  gitea:
    image: gitea/gitea:28
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__security__ALLOWED_HOST_LIST=172.30.0.0/24
    ports:
      - "3000:3000"   # Web UI
      - "222:22"      # SSH (git用)
    volumes:
      - ./gitea:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- PostgreSQL: Gitea用DB ----
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- Quartz: mdをHTMLへビルド + webhook受け口 ----
  quartz:
    build: ./quartz
    environment:
      # 任意: 設定するとcontentが空のとき初回に自動cloneします
      # 例: http://gitea:3000/<user>/<vault-repo>.git
      - CONTENT_REPO=${CONTENT_REPO:-}
    volumes:
      - ./content:/quartz/content              # 公開するvault(丸ごと)
      - ./public:/quartz/public                # ビルド成果物(nginxが配信)
      - ./quartz/quartz.config.ts:/quartz/quartz.config.ts:ro
      - ./quartz/quartz.layout.ts:/quartz/quartz.layout.ts:ro
      - ./quartz/styles:/quartz/quartz/styles/custom:ro   # カスタムCSS(ディレクトリごと)
    ports:
      - "4000:4000"   # webhook (手動trigger/デバッグ用。不要なら削除可)
    depends_on:
      - gitea
    restart: unless-stopped

  # ---- Nginx: 生成されたサイトを配信 ----
  web:
    image: nginx:latest
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - quartz
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
